<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Marci Metzger Homes | Pahrump, NV Realtor</title>
<meta name="description" content="Marci Metzger, The Ridge Realty Group — nearly three decades of real estate experience serving Pahrump and Southern Nevada." />

<!-- fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>

        colors: {
          ink: '#211D1A',
          sand: '#F3ECDD',
          clay: '#9C4A28',
          claydark: '#7C3A1F',
          dusk: '#37485A',
          gold: '#C89B3C',

        fontFamily: {
          serif: ['Fraunces', 'serif'],
          sans: ['"Public Sans"', 'sans-serif'],

      },
    },

<link rel="stylesheet" href="css/style.css" />

<div id="root"></div>
